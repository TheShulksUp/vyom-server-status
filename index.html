<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vyom's Server Status</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 48px 20px; background: #111; color: #f5f5f5; }
    h1 { margin-bottom: .25rem; } .muted { color: #a3a3a3; }
    .card { background: #1c1c1c; border-radius: 16px; padding: 24px; margin: 24px 0; box-shadow: 0 5px 20px #0004; }
    .status { font-size: 1.45rem; font-weight: 700; } .online { color: #4ade80; } .offline { color: #fb7185; }
    a { color: #93c5fd; } dt { color: #a3a3a3; margin-top: 14px; } dd { margin: 3px 0; }
  </style>
</head>
<body>
  <h1>Vyom's Server Status</h1>
  <p class="muted">MacBook Air M2 · macOS and Fedora</p>
  <main class="card" aria-live="polite">
    <p id="state" class="status">Checking latest heartbeat…</p>
    <dl id="details" hidden>
      <dt>Current system</dt><dd id="system"></dd>
      <dt>Last heartbeat</dt><dd id="updated"></dd>
    </dl>
    <p id="message" class="muted"></p>
  </main>
  <p><a href="macos.html">macOS details</a> · <a href="fedora.html">Fedora details</a></p>

  <script>
    const maxAgeMs = 3 * 60 * 1000;
    const names = { macos: "macOS", fedora: "Fedora Linux" };
    async function showStatus() {
      const state = document.querySelector("#state");
      const message = document.querySelector("#message");
      try {
        const response = await fetch(`status.json?cache=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("No status file yet");
        const data = await response.json();
        const age = Date.now() - Date.parse(data.updatedAt);
        const fresh = Number.isFinite(age) && age >= 0 && age < maxAgeMs;
        state.textContent = fresh ? "● ONLINE" : "● OFFLINE";
        state.className = `status ${fresh ? "online" : "offline"}`;
        document.querySelector("#details").hidden = false;
        document.querySelector("#system").textContent = names[data.system] || data.system || "Unknown";
        document.querySelector("#updated").textContent = new Date(data.updatedAt).toLocaleString();
        message.textContent = fresh
          ? "This system sent a heartbeat within the last three minutes."
          : "The last heartbeat is more than three minutes old, so neither system is considered online.";
      } catch (_) {
        state.textContent = "● OFFLINE";
        state.className = "status offline";
        message.textContent = "No current heartbeat is available.";
      }
    }
    showStatus();
    setInterval(showStatus, 30_000);
  </script>
</body>
</html>
